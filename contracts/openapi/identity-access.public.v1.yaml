openapi: 3.1.0
info:
  title: MAVULA Identity Access API
  version: 1.0.0
  description: Institutional OAuth 2.0 and OpenID Connect authorization surface.
  license: { name: GNU Affero General Public License v3.0 only, identifier: AGPL-3.0-only }
servers:
  - url: https://identity.mavula.dev
security: []
paths:
  /.well-known/openid-configuration:
    get:
      operationId: getOpenIdConfiguration
      tags: [Discovery]
      responses:
        '200': { description: OpenID Provider metadata }
  /jwks:
    get:
      operationId: getJsonWebKeySet
      tags: [Discovery]
      responses:
        '200': { description: Public PS256 signing keys }
  /auth:
    get:
      operationId: authorize
      tags: [OAuth2]
      parameters:
        - { in: query, name: client_id, required: true, schema: { type: string } }
        - { in: query, name: redirect_uri, required: true, schema: { type: string, format: uri } }
        - { in: query, name: response_type, required: true, schema: { const: code } }
        - { in: query, name: scope, required: true, schema: { type: string } }
        - { in: query, name: state, required: true, schema: { type: string } }
        - { in: query, name: code_challenge, required: true, schema: { type: string } }
        - { in: query, name: code_challenge_method, required: true, schema: { const: S256 } }
      responses:
        '302': { description: Authorization redirect }
  /token:
    post:
      operationId: exchangeToken
      tags: [OAuth2]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: OAuth token response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/OAuthError' }
  /token/revocation:
    post:
      operationId: revokeToken
      tags: [OAuth2]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '200': { description: Revocation accepted }
  /api/v1/me:
    get:
      operationId: getEffectiveOperatorIdentity
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'Effective tenant, institution, branch, roles and permissions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /auth
          tokenUrl: /token
          scopes: { openid: Authenticate operator, profile: Read effective identity }
        clientCredentials:
          tokenUrl: /token
          scopes: { internal.worker: Invoke protected service callbacks }
  schemas:
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { const: Bearer }
        expires_in: { type: integer }
        refresh_token: { type: string }
        scope: { type: string }
  responses:
    OAuthError: { description: OAuth 2.0 error response }
    Unauthorized: { description: Bearer token is missing or invalid }
